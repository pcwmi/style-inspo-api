# Model configurations for evaluation
# Add or remove models as needed
# Last updated: Nov 2025 - Added prompt_version for A/B testing

models:
  # Anthropic Claude Models - Baseline Prompt
  - id: claude_sonnet_45_baseline
    name: "Claude Sonnet 4.5 (Baseline)"
    model: claude-sonnet-4-5-20250929
    temperature: 0.7
    max_tokens: 2000
    prompt_version: baseline_v1
    description: "Claude Sonnet 4.5 with baseline Style Constitution prompt"

  # Anthropic Claude Models - Fit Constraints Prompt
  - id: claude_sonnet_45_fit_constraints
    name: "Claude Sonnet 4.5 (Fit Constraints)"
    model: claude-sonnet-4-5-20250929
    temperature: 0.7
    max_tokens: 2000
    prompt_version: fit_constraints_v2
    description: "Claude Sonnet 4.5 with garment fit constraints"

  # OpenAI GPT-4o - Baseline Prompt
  - id: gpt4o_baseline
    name: "GPT-4o (Baseline)"
    model: gpt-4o
    temperature: 0.7
    max_tokens: 2000
    prompt_version: baseline_v1
    description: "GPT-4o with baseline Style Constitution prompt"

  # OpenAI GPT-4o - Fit Constraints Prompt
  - id: gpt4o_fit_constraints
    name: "GPT-4o (Fit Constraints)"
    model: gpt-4o
    temperature: 0.7
    max_tokens: 2000
    prompt_version: fit_constraints_v2
    description: "GPT-4o with garment fit constraints"

  # OpenAI GPT-4o Mini - Baseline Prompt
  - id: gpt4o_mini_baseline
    name: "GPT-4o Mini (Baseline)"
    model: gpt-4o-mini
    temperature: 0.7
    max_tokens: 2000
    prompt_version: baseline_v1
    description: "GPT-4o Mini with baseline Style Constitution prompt"

  # OpenAI GPT-4o Mini - Fit Constraints Prompt
  - id: gpt4o_mini_fit_constraints
    name: "GPT-4o Mini (Fit Constraints)"
    model: gpt-4o-mini
    temperature: 0.7
    max_tokens: 2000
    prompt_version: fit_constraints_v2
    description: "GPT-4o Mini with garment fit constraints"

  # Google Gemini - Baseline Prompt
  - id: gemini_2_flash_baseline
    name: "Gemini 2.0 Flash (Baseline)"
    model: gemini-2.0-flash-exp
    temperature: 0.7
    max_tokens: 2000
    prompt_version: baseline_v1
    description: "Gemini 2.0 Flash with baseline Style Constitution prompt"

  # Google Gemini - Fit Constraints Prompt
  - id: gemini_2_flash_fit_constraints
    name: "Gemini 2.0 Flash (Fit Constraints)"
    model: gemini-2.0-flash-exp
    temperature: 0.7
    max_tokens: 2000
    prompt_version: fit_constraints_v2
    description: "Gemini 2.0 Flash with garment fit constraints"

  # ===== CHAIN-OF-THOUGHT PROMPT (Dec 2025 - Testing 5-star outputs) =====
  # Testing chain-of-thought reasoning to push models toward creative tail

  # OpenAI GPT-4o - Chain of Thought (PRIMARY TEST)
  - id: gpt4o_chain_of_thought
    name: "GPT-4o (Chain-of-Thought)"
    model: gpt-4o
    temperature: 0.7
    max_tokens: 3000  # Increased for reasoning steps
    prompt_version: chain_of_thought_v1
    description: "GPT-4o with explicit reasoning steps to avoid 4-star plateau"

  # Claude Sonnet 4.5 - Chain of Thought
  - id: claude_sonnet_45_chain_of_thought
    name: "Claude Sonnet 4.5 (Chain-of-Thought)"
    model: claude-sonnet-4-5-20250929
    temperature: 0.7
    max_tokens: 3000  # Increased for reasoning steps
    prompt_version: chain_of_thought_v1
    description: "Claude Sonnet 4.5 with explicit reasoning steps"

  # ===== A/B TEST: REASONING HYPOTHESIS (Jan 2026) =====
  # Testing whether "ask yourself" prompt reduces physically nonsensical outfits

  # Control: Current chain-of-thought (no reasoning question)
  - id: gpt4o_cot_control
    name: "Control (Current COT)"
    model: gpt-4o
    temperature: 0.7
    max_tokens: 3000
    prompt_version: chain_of_thought_v1
    description: "Control: GPT-4o with current chain-of-thought prompt"

  # Treatment A: Chain-of-thought with reasoning question
  - id: gpt4o_cot_reasoning
    name: "Treatment A (Reasoning Prompt)"
    model: gpt-4o
    temperature: 0.7
    max_tokens: 3000
    prompt_version: chain_of_thought_reasoning_v1
    description: "Treatment A: GPT-4o with reasoning question about bulk/comfort"

  # ===== VISION A/B TEST (Feb 2026) =====
  # Hypothesis: Vision-informed generation reduces physically nonsensical outfits

  # Control: Text-only baseline (no images)
  - id: gpt4o_text_only
    name: "Control (Text-Only)"
    model: gpt-4o
    temperature: 0.7
    max_tokens: 2000
    prompt_version: baseline_v1
    description: "Control: GPT-4o with text metadata only (no images)"

  # Treatment: Vision-informed (with wardrobe images)
  - id: gpt4o_vision
    name: "Treatment (Vision-Informed)"
    model: gpt-4o
    temperature: 0.7
    max_tokens: 2000
    prompt_version: vision_v1
    description: "Treatment: GPT-4o with wardrobe images (low detail, 85 tokens each)"

  # ===== PRODUCTION MODEL (Feb 2026) =====
  # GPT-5.2 with chain-of-thought - matches production agent config
  - id: gpt52_chain_of_thought
    name: "GPT-5.2 (Chain-of-Thought)"
    model: gpt-5.2
    temperature: 0.7
    max_tokens: 3000
    prompt_version: chain_of_thought_v1
    description: "Production model: GPT-5.2 with chain-of-thought reasoning"
